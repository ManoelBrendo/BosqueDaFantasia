name: Publish site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Brave
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo curl -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
          sudo apt-get update
          sudo apt-get install --yes brave-browser

      - name: Validate structure
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Run browser and accessibility tests
        run: npm run test:e2e
        env:
          BOSQUE_BROWSER_EXECUTABLE_PATH: /usr/bin/brave-browser

      - name: Build static site
        run: npm run build

      - name: Upload browser test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: artifacts/qa/
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published site and optional API
        run: npm run smoke:deploy
        env:
          BOSQUE_SITE_URL: ${{ steps.deployment.outputs.page_url }}
          BOSQUE_API_HEALTH_URL: ${{ vars.BOSQUE_API_HEALTH_URL }}
