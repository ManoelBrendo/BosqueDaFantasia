name: Validate site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Brave
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo curl -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
          sudo apt-get update
          sudo apt-get install --yes brave-browser

      - name: Validate structure
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Run browser and accessibility tests
        run: npm run test:e2e
        env:
          BOSQUE_BROWSER_EXECUTABLE_PATH: /usr/bin/brave-browser

      - name: Build static artifact
        run: npm run build

      - name: Upload browser test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: |
            artifacts/qa/
            artifacts/visual-regressions/
          if-no-files-found: ignore
          retention-days: 7
